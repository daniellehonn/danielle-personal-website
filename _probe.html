<body style="margin:0">
<iframe id="a" src="project-002.html" style="width:900px;height:2400px;border:0"></iframe>
<iframe id="b" src="index.html" style="width:900px;height:2400px;border:0"></iframe>
<script>
setTimeout(function(){
  var out=[];
  ['a','b'].forEach(function(id){
    var d=document.getElementById(id).contentDocument;
    var vw=d.documentElement.clientWidth, bad=[];
    d.querySelectorAll('.site *').forEach(function(el){
      var r=el.getBoundingClientRect();
      if(r.width>0 && r.right>vw+1) bad.push((el.tagName+'.'+(el.className||'')).slice(0,34)+'@'+Math.round(r.right));
    });
    var seen={},u=[];
    bad.forEach(function(b){var k=b.split('@')[0];if(!seen[k]){seen[k]=1;u.push(b);}});
    out.push((id=='a'?'case':'index')+'='+(u.length?'OVERFLOW '+u.slice(0,4).join(','):'CLEAN'));
  });
  document.title='VW=900 :: '+out.join('  ||  ');
},1500);
</script>
</body>
